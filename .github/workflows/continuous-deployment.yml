name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          cache-on-failure: true
      - name: Install Rust
        working-directory: ./backend
        run: rustup show # picks the version from rust-toolchain.toml
      - name: Setup Cross-Compilation
        working-directory: ./backend
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Compile Backend
        working-directory: backend
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package Artifacts
        run: |
          mkdir -p backend-artifacts
          for file in backend/target/aarch64-unknown-linux-gnu/release/*; do
            if [ -f "$file" ]; then
              cp "$file" backend-artifacts/
            fi
          done
      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: backend-artifacts/
          retention-days: 1

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  deploy-staging:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - run: echo "Deploying to domain ${{ vars.DOMAIN_STAGING }} (${{ vars.HOSTED_ZONE_ID_STAGING }})"
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: eu-central-1

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies (Infrastructure)
        working-directory: ./infrastructure
        run: npm ci

      - name: Bootstrap CDK Environments
        working-directory: ./infrastructure
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap aws://$ACCOUNT_ID/eu-central-1 aws://$ACCOUNT_ID/us-east-1

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: downloaded-backend

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: downloaded-frontend

      - name: CDK Deploy
        working-directory: ./infrastructure
        run: |
          npx cdk deploy CertificateStack AppStack --require-approval never \
            -c mode=stage \
            -c domain=${{ vars.DOMAIN_STAGING }} \
            -c hostedZoneId=${{ vars.HOSTED_ZONE_ID_STAGING }} \
            -c githubRepo=${{ github.repository }} \
            -c backendPath=../downloaded-backend \
            -c frontendPath=../downloaded-frontend
