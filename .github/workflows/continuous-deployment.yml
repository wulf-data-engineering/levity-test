name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  # Builds the backend if it wasn't part of the cache
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Calculate Hash
        id: hash
        run: echo "source_hash=${{ hashFiles('backend/**') }}" >> $GITHUB_OUTPUT
      - name: Restore Backend Build
        id: cache
        uses: actions/cache@v5
        with:
          path: backend-artifacts/
          key: backend-${{ steps.hash.outputs.source_hash }}

      - name: Cache Rust Environment
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo-docker/registry
            ~/.cargo-docker/rustup
            ~/.cargo-docker/target
          key: ${{ runner.os }}-rust-docker-${{ hashFiles('backend/rust-toolchain.toml') }}-${{ steps.hash.outputs.source_hash }}
          restore-keys: |
            ${{ runner.os }}-rust-docker-${{ hashFiles('backend/rust-toolchain.toml') }}
            ${{ runner.os }}-rust-docker-

      - name: Cross-compile Backend and package artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Create local folders to ensure permissions are manageable
          mkdir -p ~/.cargo-docker/registry ~/.cargo-docker/rustup backend-artifacts
          
          docker run --rm \
            --platform linux/amd64 \
            -v ${{ github.workspace }}:/app \
            -v ~/.cargo-docker/registry:/var/cargo/registry \
            -v ~/.cargo-docker/rustup:/var/cargo/rustup \
            -v backend/target:/var/cargo/target \
            -w /app \
            -e RUSTUP_HOME=/var/cargo/rustup \
            -e CARGO_HOME=/var/cargo/registry \
            -e CARGO_TARGET_DIR=/var/cargo/target \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linker \
            -e CC_aarch64_unknown_linux_gnu=clang \
            -e AR_aarch64_unknown_linux_gnu=llvm-ar \
            ghcr.io/wulf-data-engineering/levity-lambda-builder:20260409 \
            bash -c "cd backend && rustup target add aarch64-unknown-linux-gnu && \
                     cargo build --release --target aarch64-unknown-linux-gnu && \
                     collect-binaries aarch64-unknown-linux-gnu release /app/backend-artifacts"

      # Docker runs as root; we must give ownership back to the GHA user so it can be saved.
      - name: Post-build Cleanup
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R $(id -u):$(id -g) ~/.cargo-docker backend-artifacts
          
      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-binaries
          path: backend-artifacts/
          retention-days: 1

  # Builds the frontend if it wasn't part of the cache
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Calculate Hash
        id: hash
        run: echo "source_hash=${{ hashFiles('frontend/**') }}" >> $GITHUB_OUTPUT
      - name: Restore Frontend Build
        id: cache
        uses: actions/cache@v5
        with:
          path: frontend/build/
          key: frontend-${{ steps.hash.outputs.source_hash }}
      - name: Setup Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Protoc
        if: steps.cache.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
      - name: Build Frontend
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  deploy-staging:
    needs: [build-backend, build-frontend]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      domain: ${{ vars.DOMAIN_STAGING }}
      awsRoleArn: ${{ vars.AWS_ROLE_ARN_STAGING }}
      certificateArn: ${{ vars.CERTIFICATE_ARN_STAGING }}

  deploy-production:
    needs: [deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      domain: ${{ vars.DOMAIN_PRODUCTION }}
      awsRoleArn: ${{ vars.AWS_ROLE_ARN_PRODUCTION }}
      certificateArn: ${{ vars.CERTIFICATE_ARN_PRODUCTION }}
