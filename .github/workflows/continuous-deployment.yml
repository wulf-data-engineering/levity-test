name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: eu-central-1

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            infrastructure/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./backend
          cache-on-failure: true

      - name: Install Rust
        working-directory: ./backend
        run: rustup show # picks the version from rust-toolchain.toml

      - name: Setup Cross-Compilation
        working-directory: ./backend
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Debug Cache Content
        working-directory: ./backend
        run: |
          ls -la
          ls -R target/ || echo "Target directory not found"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Install dependencies (Infrastructure)
        working-directory: ./infrastructure
        run: npm ci

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      - name: Pre-compile Backend
        working-directory: backend
        # Explicitely build for the target platform to populate cache and fail fast
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Debug Content To Cache
        run: |
          ls -R backend/target || echo "Target directory not found"

      - name: CDK Deploy
        working-directory: ./infrastructure
        run: |
          npx cdk deploy AppStack --require-approval never \
            -c mode=stage \
            -c domain=${{ vars.DOMAIN_STAGING }} \
            -c hostedZoneId=${{ vars.HOSTED_ZONE_ID_STAGING }} \
            -c githubRepo=${{ github.repository }}
