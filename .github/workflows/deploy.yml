# Deploys certificate and app stack to an AWS account
name: Deploy Stack

on:
  workflow_call:
    inputs:
      domain:
        required: true
        type: string
      imageDigest:
        description: "The ECR image digest to deploy"
        required: false
        type: string
      serverRepositoryArn:
        description: "The ECR repository ARN"
        required: false
        type: string
      environment:
        required: true
        type: string
    secrets:
      awsRoleArn:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.awsRoleArn }}
          aws-region: eu-central-1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies (Infrastructure)
        working-directory: ./infrastructure
        run: npm ci

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v8
        with:
          name: backend-binaries
          path: downloaded-backend

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: downloaded-frontend

      - name: CDK Deploy for ${{ inputs.domain }}
        working-directory: ./infrastructure
        run: |
          npx cdk deploy AppStack --require-approval never \
            -c environment=${{ inputs.environment }} \
            -c domain=${{ inputs.domain }} \
            -c serverRepositoryArn=${{ inputs.serverRepositoryArn }} \
            -c imageDigest=${{ inputs.imageDigest }} \
            -c githubRepo=${{ github.repository }} \
            -c backendPath=../downloaded-backend \
            -c frontendPath=../downloaded-frontend \

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Image as ${{ inputs.environment }}
        run: |
          REPO="levity-test/server"
          MANIFEST=$(aws ecr batch-get-image --repository-name $REPO --image-ids imageDigest=${{ inputs.imageDigest }} --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name $REPO --image-tag ${{ inputs.environment }} --image-manifest "$MANIFEST"
