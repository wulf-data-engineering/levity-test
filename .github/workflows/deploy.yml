# Deploys certificate and app stack to an AWS account
name: Deploy Stack

on:
  workflow_call:
    inputs:
      domain:
        required: true
        type: string
      hostedZoneId:
        required: true
        type: string
      spot:
        required: false
        type: boolean
        default: false
      imageDigest:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      awsRoleArn:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.awsRoleArn }}
          aws-region: eu-central-1

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies (Infrastructure)
        working-directory: ./infrastructure
        run: npm ci

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: downloaded-backend

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: downloaded-frontend

      - name: CDK Deploy for ${{ inputs.domain }} (${{ inputs.hostedZoneId }})
        working-directory: ./infrastructure
        run: |
          npx cdk deploy AppStack --require-approval never \
            -c mode=stage \
            -c domain=${{ inputs.domain }} \
            -c hostedZoneId=${{ inputs.hostedZoneId }} \
            -c githubRepo=${{ github.repository }} \
            -c spot=${{ inputs.spot }} \
            -c backendPath=../downloaded-backend \
            -c frontendPath=../downloaded-frontend \
            -c imageDigest=${{ inputs.imageDigest }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Image as ${{ inputs.environment }}
        run: |
          REPO="levity-test/server"
          MANIFEST=$(aws ecr batch-get-image --repository-name $REPO --image-ids imageDigest=${{ inputs.imageDigest }} --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name $REPO --image-tag ${{ inputs.environment }} --image-manifest "$MANIFEST"
